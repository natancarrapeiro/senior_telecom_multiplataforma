workflows:
  ios-compose-build:
    name: Build iOS Compose Multiplatform
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      groups:
        - target
    scripts:
      - name: Set up local.properties and Environment
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      
      - name: Build do Aplicativo iOS (.app)
        script: |
          # Inicializa o ambiente Java correto para o Gradle rodar dentro do Xcode
          export JAVA_HOME=$JAVA_HOME_INTEL_21 || export JAVA_HOME=$JAVA_HOME
          
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
                     -scheme iosApp \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO
    artifacts:
      - iosApp/build/Build/Products/Debug-iphonesimulator/*.app
